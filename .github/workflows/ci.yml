name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups --extra ml
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend (eslint · vitest · next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      # `next build` type-checks the project itself (it needs its own generated route types to
      # exist first, which a standalone `tsc --noEmit` run before it does not have).
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, against a real API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security:
    name: Security scanners (bandit, pip-audit) — advisory
    runs-on: ubuntu-latest
    # Findings are surfaced, not yet a merge gate (see docs/THREAT_MODEL.md and docs/PROGRESS.md);
    # a network-dependent vulnerability-DB lookup failing should not block unrelated work.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --extra ml
      - name: Bandit (static security lint)
        run: uv run --with bandit bandit -q -r backend simulator ml scripts -c pyproject.toml
      - name: pip-audit (known-vulnerability scan of installed packages)
        run: uv run --with pip-audit pip-audit --strict

  postgres:
    name: PostgreSQL + TimescaleDB
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel  # throwaway credential for this CI-only service container
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --extra ml
      - name: Migrations, hypertables, compression and retention policies
        run: uv run pytest tests/api -m postgres -q
